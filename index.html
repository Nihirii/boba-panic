<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boba Panic</title>
<meta name="theme-color" content="#0d0a1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Neonderthaw&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
  --bg:#0d0a1c;--bg2:#161231;--surf:#1c1640;--surf2:#251d50;--edge:rgba(196,170,255,.16);--sh:#06040f;
  --pink:#ff3d9a;--pinkD:#c4176f;--pink2:rgba(255,61,154,.18);--cyan:#2ff3ff;--matcha:#9dff57;--matcha2:rgba(157,255,87,.14);--taro:#b07cff;--taro2:rgba(176,124,255,.18);--gold:#ffd84d;
  --ink:#f5eeff;--ink2:#a99bcf;--ok:#7dff8a;--okbg:rgba(125,255,138,.13);--bad:#ff4f7b;--badbg:rgba(255,79,123,.15);--paper:#1c1640;--r:18px;
  --gP:0 0 6px rgba(255,61,154,.75),0 0 18px rgba(255,61,154,.4);--gC:0 0 6px rgba(47,243,255,.7),0 0 18px rgba(47,243,255,.35);
  --fdisp:Outfit,"Trebuchet MS",system-ui,sans-serif;--fneon:Neonderthaw,"Brush Script MT",cursive;--fmono:ui-monospace,Consolas,"Courier New",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--fdisp);color:var(--ink);background:var(--bg);
  background-image:radial-gradient(ellipse 60% 45% at 8% 0%,rgba(255,61,154,.22),transparent 70%),radial-gradient(ellipse 55% 45% at 100% 100%,rgba(47,243,255,.16),transparent 70%),radial-gradient(ellipse 50% 40% at 70% 10%,rgba(176,124,255,.14),transparent 70%);
  user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;touch-action:manipulation;font-size:inherit}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(250px,310px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:10px;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
header{grid-column:1/-1;display:flex;align-items:center;gap:8px;min-width:0}
.logo{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:700;white-space:nowrap}
.logo b{font-family:var(--fneon);font-weight:400;font-size:1.65em;line-height:1;color:#ffe3f2;text-shadow:var(--gP);padding:0 4px}
.pill{background:var(--surf);border:1px solid var(--edge);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;box-shadow:0 3px 0 var(--sh);white-space:nowrap}
#hScore{color:var(--cyan);text-shadow:0 0 8px rgba(47,243,255,.6);font-family:var(--fmono);letter-spacing:.5px}
.spacer{flex:1}
.ibtn{width:42px;height:42px;border-radius:14px;background:var(--surf);border:1px solid var(--edge);box-shadow:0 3px 0 var(--sh);font-size:19px;display:grid;place-items:center;position:relative;flex:none}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sh)}
.ibtn span{position:absolute;top:-5px;right:-5px;background:var(--taro);box-shadow:0 0 8px var(--taro);color:#fff;font-size:11px;border-radius:999px;padding:1px 6px;font-weight:700}
.panel{background:rgba(24,19,52,.86);border-radius:var(--r);border:1px solid var(--edge);box-shadow:0 0 0 1px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.45);min-height:0;min-width:0}
#orderPanel{grid-column:1;grid-row:2;overflow-y:auto;overflow-x:hidden;padding:12px;display:flex;flex-direction:column;gap:9px}
#factoryPanel{grid-column:2;grid-row:2;overflow:hidden;display:flex;flex-direction:column;background:#120e28;border-color:rgba(255,61,154,.35);box-shadow:0 0 0 1px rgba(0,0,0,.3),0 0 26px rgba(255,61,154,.16),0 10px 30px rgba(0,0,0,.45)}
#band{grid-column:1/-1;grid-row:3;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}

.ordHead{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:15px;font-weight:600}
.ordHead small{color:var(--ink2);font-weight:500}
.cust{display:flex;gap:10px;align-items:flex-start}
.client{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:700;width:70px}
.avatar{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 55%,#2a2158 0 52%,#16112f 53% 60%,var(--ring,#ff3d9a) 61% 64%,transparent 65%);box-shadow:0 0 14px color-mix(in srgb,var(--ring,#ff3d9a) 55%,transparent);position:relative}
.avatar svg{width:60px;height:60px;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.client.wob .avatar svg{animation:wob .3s}
.client .nm{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--surf2);border:1px solid var(--edge);border-radius:999px;padding:0 8px}
.custR{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.moodTx{font-size:12.5px;color:var(--ink2);font-style:italic;display:flex;align-items:center;gap:6px}
.moodTx::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--md,#b07cff);box-shadow:0 0 8px var(--md,#b07cff);flex:none}
.bubble{position:relative;background:var(--surf2);border:1px solid rgba(47,243,255,.3);border-radius:4px 16px 16px 16px;padding:8px 12px;font-size:15px;line-height:1.32}
.bubble em{display:block;font-size:12.5px;color:var(--ink2);margin-top:4px}
.patience{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;font-family:var(--fmono)}
.timer{flex:1;height:10px;border-radius:99px;background:#0b081a;border:1px solid var(--edge);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cyan),var(--matcha));box-shadow:0 0 10px rgba(157,255,87,.6);border-radius:99px;transform-origin:left}
.timer.low i{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.tkWrap{filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.ticket{background:var(--paper);padding:0 0 16px;position:relative;border-radius:12px 12px 0 0;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),95% 100%,90% calc(100% - 7px),85% 100%,80% calc(100% - 7px),75% 100%,70% calc(100% - 7px),65% 100%,60% calc(100% - 7px),55% 100%,50% calc(100% - 7px),45% 100%,40% calc(100% - 7px),35% 100%,30% calc(100% - 7px),25% 100%,20% calc(100% - 7px),15% 100%,10% calc(100% - 7px),5% 100%,0 calc(100% - 7px))}
.tkTop{display:flex;justify-content:space-between;align-items:center;gap:6px;background:repeating-linear-gradient(135deg,#e8288a 0 10px,#d01c7a 10px 20px);color:#fff;padding:6px 11px;border-radius:12px 12px 0 0}
.tkTop b{font-size:15px;letter-spacing:.5px}
.tkTop span{font-family:var(--fmono);font-size:11.5px;letter-spacing:1px;background:rgba(0,0,0,.28);border-radius:6px;padding:1px 6px}
.tkBody{display:flex;gap:10px;align-items:stretch;padding:9px 10px 4px}
.tkCup{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:radial-gradient(circle at 50% 70%,rgba(47,243,255,.14),#120e28 75%);border:1px solid var(--edge);border-radius:12px;padding:4px}
.tkCup svg{width:100%;height:auto;max-height:110px}
.tkCup small{font-size:10px;color:var(--ink2);font-weight:600;letter-spacing:.5px}
.tkRows{list-style:none;margin:0;padding:0;display:grid;gap:4px;flex:1;min-width:0;align-content:start}
.tkRows li{display:grid;grid-template-columns:20px 20px minmax(0,1fr);align-items:center;gap:7px;padding:5px 7px;border-radius:10px;font-size:14px;line-height:1.15;border:2px solid transparent;transition:background .2s}
.tkRows .box{width:20px;height:20px;border-radius:6px;border:2px solid #4f4580;background:#120e28;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.tkRows .ic{width:20px;height:20px}
.tkRows .tx{min-width:0}
.tkRows .tx b{font-weight:600;display:block}
.tkRows .tx small{display:block;font-size:11.5px;color:var(--ink2);margin-top:1px}
.tkRows .ln{display:flex;justify-content:space-between;gap:6px;font-weight:600}
.tkRows .ln+.ln,.tkRows small+.ln{margin-top:2px}
.tkRows .dots{font-family:var(--fmono);font-size:11px;letter-spacing:1px;color:var(--ink);white-space:nowrap;flex:none}
.tkRows li.cur{background:var(--pink2);border-color:var(--pink);box-shadow:0 0 10px rgba(255,61,154,.35)}
.tkRows li.cur .box{border-color:var(--pink);background:var(--pink)}
.tkRows li.cur .box::before{content:"▶";font-size:9px}
.tkRows li.done .box{background:#5a4f86;border-color:#5a4f86}.tkRows li.done .box::before{content:"✓"}
.tkRows li.done .tx{opacity:.7}
.tkRows li.ok .box{background:var(--ok);border-color:var(--ok)}.tkRows li.ok .box::before{content:"✓"}
.tkRows li.bad{background:var(--badbg)}.tkRows li.bad .box{background:var(--bad);border-color:var(--bad)}.tkRows li.bad .box::before{content:"✗"}
.tkFoot{display:flex;justify-content:space-between;gap:6px;font-family:var(--fmono);font-size:10.5px;color:var(--ink2);border-top:1.5px dashed #3f3570;margin:4px 10px 0;padding-top:5px;letter-spacing:.5px}
.stampOk{position:absolute;right:12px;top:42px;border:3px solid var(--ok);color:var(--ok);font-weight:700;font-size:15px;letter-spacing:2px;padding:1px 8px;border-radius:8px;transform:rotate(-12deg);background:rgba(13,10,28,.85);box-shadow:0 0 12px rgba(125,255,138,.5);text-shadow:0 0 6px rgba(125,255,138,.7);animation:stamp2 .4s cubic-bezier(.3,1.7,.5,1) both;pointer-events:none}
@keyframes stamp2{from{transform:rotate(-12deg) scale(2.4);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.riddle{font-style:italic;background:#0a0718;border:1px solid rgba(176,124,255,.45);box-shadow:inset 0 0 18px rgba(176,124,255,.18);color:#e9dcff;padding:9px 11px;border-radius:10px;font-size:13.5px;line-height:1.4;flex:1}
.queue{display:flex;gap:2px;align-items:center;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.queue svg{width:28px;height:28px}
.queue small{font-weight:600;margin-right:4px}
.labHist{font-size:13px;color:var(--ink2);line-height:1.4}.labHist b{color:var(--ink)}

.stations{display:flex;gap:4px;padding:7px;justify-content:center;flex:none}
.stations span{flex:1;max-width:120px;text-align:center;font-size:12.5px;font-weight:600;padding:4px;border-radius:999px;background:#0b081a;color:var(--ink2);border:1px solid #2e2658;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stations span.cur{background:var(--pink);color:#fff;border-color:var(--pink);box-shadow:var(--gP)}
.stations span.done{background:var(--matcha2);color:var(--matcha);border-color:rgba(157,255,87,.45)}
.factory{position:relative;flex:1;min-height:0;overflow:hidden;--beltH:48px;container-type:size}
.wall{position:absolute;inset:0;background-color:#141030;
  background-image:radial-gradient(ellipse 70% 55% at 50% 0%,rgba(176,124,255,.22),transparent 70%),radial-gradient(ellipse 60% 40% at 50% 100%,rgba(255,61,154,.2),transparent 75%),
  linear-gradient(rgba(0,0,0,.35) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.3) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.3) 2px,transparent 2px);
  background-size:100% 100%,100% 100%,100% 26px,52px 52px,52px 52px;background-position:0 0,0 0,0 0,0 0,26px 26px}
.wall::after{content:"ouvert la nuit";position:absolute;left:5%;bottom:calc(var(--beltH) + 16%);font-family:var(--fneon);font-size:clamp(26px,7cqh,46px);color:#fff0f8;text-shadow:0 0 3px #fff,0 0 10px #ff3d9a,0 0 24px #ff3d9a,0 0 40px rgba(255,61,154,.6);transform:rotate(-7deg);animation:flicker 7s infinite;white-space:nowrap}
@container (max-width:560px){.wall::after{display:none}}
.track{position:absolute;left:0;top:0;bottom:var(--beltH);width:500%;display:flex;transition:transform .45s cubic-bezier(.5,0,.3,1)}
.machine{flex:0 0 20%;position:relative}
.machine::before{content:"";position:absolute;top:22px;left:0;right:0;height:8px;background:linear-gradient(#2c2458,#1a1438);border-top:1px solid rgba(47,243,255,.55);border-bottom:1px solid #07050f;box-shadow:0 -1px 8px rgba(47,243,255,.25)}
.mbody{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:min(76%,300px);height:var(--mH,36%);cursor:pointer;z-index:1}
.msvg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 5px var(--mg,rgba(255,61,154,.6)))}
.m0{--mg:rgba(255,61,154,.65)}.m1{--mg:rgba(176,124,255,.7)}.m2{--mg:rgba(157,255,87,.55)}.m3{--mg:rgba(255,216,77,.55)}
.machine.wobble .mbody{animation:mwob .35s}
@container (max-height:340px){.track,.cupwrap{--mH:26%}}
@container (max-height:230px){.track,.cupwrap{--mH:22%}}
.machine.munch .mbody{animation:munch .18s 5}
.machine.pouring .tapHandle{animation:tapTurn .6s}
.pump.press .phead{animation:pumpDown .5s}
.machine.dropping .gate{animation:gate .3s}
.midHop .hp{fill:var(--hc,#3ab4ff)}
.plate{position:absolute;left:50%;top:calc(6px + var(--mH,36%) - 6px);width:78px;height:14px;margin-left:-39px;border-radius:5px 5px 9px 9px;background:linear-gradient(#3a3060,#211a44);border:2px solid var(--gold);box-shadow:0 0 10px rgba(255,216,77,.55);z-index:2}
.machine.pressing .plate{animation:press .42s cubic-bezier(.6,0,.4,1)}
.redbtn{position:absolute;top:calc(6px + var(--mH,36%) - 2px);left:calc(50% - min(38%,150px) + 2px);width:32px;height:32px;display:grid;place-items:center;z-index:4}
.redbtn i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9a9a,#ff1f4a);box-shadow:0 2px 0 #7a0a22,0 0 8px rgba(255,31,74,.8)}
.redbtn:active i{transform:translateY(2px);box-shadow:none}
.counter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.cWin{width:min(46%,120px);aspect-ratio:1;border-radius:50% 50% 14px 14px;background:radial-gradient(circle at 50% 80%,rgba(176,124,255,.35),#1a1438 70%);border:3px solid var(--taro);box-shadow:0 0 14px rgba(176,124,255,.6),inset 0 0 14px rgba(176,124,255,.35);display:grid;place-items:center;overflow:hidden}
.cWin svg{width:86%;height:86%;margin-top:14%}
.cSign{margin-top:-6px;background:#0b081a;color:#e6d6ff;font-weight:700;font-size:12px;letter-spacing:2px;padding:2px 12px;border-radius:999px;border:2px solid var(--taro);box-shadow:0 0 10px rgba(176,124,255,.6);text-shadow:0 0 6px var(--taro);z-index:1}
.heart{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-weight:700;color:#fff;background:var(--pink);box-shadow:var(--gP);border-radius:12px;padding:3px 10px;font-size:14px;animation:heartUp 1.4s forwards;z-index:5;white-space:nowrap}
.cupwrap{position:absolute;left:50%;bottom:calc(var(--beltH) - 10px);height:min(calc(100% - var(--mH,36%) - 18px - var(--beltH) + 10px),300px);aspect-ratio:140/196;max-width:90%;transform:translateX(-50%);z-index:3}
#mainCup,#mainCup svg{width:100%;height:100%;display:block}
#mainCup svg{filter:drop-shadow(0 0 10px rgba(47,243,255,.28))}
.cupwrap.ride{animation:ride .45s}
.cupwrap.arrive{animation:arrive .5s ease-out}
.cupwrap.startle{animation:startle .5s}
.cupwrap.leave{animation:leave .4s ease-in forwards}
.sleepy{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
.sleepy svg{position:absolute;left:0;top:0;width:100%;height:100%}
.sleepy b{position:absolute;right:-12%;top:0;font-size:20px;color:var(--taro);text-shadow:0 0 8px var(--taro);animation:zzz 2s infinite}
.sleepy b+b{animation-delay:1s;right:-24%;font-size:15px}
.cupwrap.sleeping .sleepy{opacity:1}
.cupwrap.sleeping #mainCup{animation:breathe 2.4s infinite}
.stream{position:absolute;left:50%;width:10px;margin-left:-5px;background:var(--c);box-shadow:0 0 10px var(--c);border-radius:5px;opacity:0;z-index:2;transform-origin:top}
.stream.on{animation:stream .6s ease-in-out}
.stream.tops{background:radial-gradient(circle,var(--c) 0 42%,transparent 48%) 0 0/12px 14px repeat-y;width:12px;margin-left:-6px;border-radius:0}
.belt{position:absolute;left:0;right:0;bottom:0;height:var(--beltH);z-index:2}
.beltTop{position:absolute;left:0;right:0;top:0;height:18px;background:repeating-linear-gradient(90deg,#2a2250 0 22px,#1d173c 22px 44px);border-top:2px solid var(--cyan);box-shadow:0 -2px 12px rgba(47,243,255,.45)}
.belt.moving .beltTop{animation:beltmove .45s linear}
.belt.moving.rev .beltTop{animation-direction:reverse}
.beltFront{position:absolute;left:0;right:0;top:18px;bottom:0;border-top:1px solid #07050f;display:flex;align-items:center;justify-content:space-between;padding:0 10px;
  background-image:radial-gradient(circle,#ff9ccc 0 2px,rgba(255,61,154,.55) 2.5px,transparent 6px),linear-gradient(#1a1438,#0e0a22);background-size:46px 100%,100% 100%;background-position:12px 50%,0 0}
.belt.moving .beltFront{animation:leds .45s steps(3)}
.oldlogo{font-size:11px;font-weight:700;color:#9b8fc4;background:#0b081a;border:1px dashed #4f4580;border-radius:8px;padding:0 8px;font-family:"Courier New",monospace;opacity:.8;min-height:24px;white-space:nowrap}
.lineTag{font-size:11px;font-weight:700;color:var(--cyan);text-shadow:0 0 6px rgba(47,243,255,.8);letter-spacing:1px;white-space:nowrap;font-family:var(--fmono)}

.bandHead{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;min-height:30px}
.stName{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.stName b{font-size:18px}
.stName span{font-size:13.5px;color:var(--ink2)}
.fb{font-size:14px;font-weight:600;padding:4px 11px;border-radius:999px;line-height:1.2}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.fbBox{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 13px;border-radius:999px;background:var(--surf2);border:1px solid var(--edge);box-shadow:0 3px 0 var(--sh);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--taro);color:#fff;box-shadow:0 3px 0 #5a32b0,0 0 12px rgba(176,124,255,.6)}
.chip.fix{background:var(--bad);color:#fff;box-shadow:0 3px 0 #7d1532,0 0 12px rgba(255,79,123,.55)}
.btns{display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:9px}
.tile{position:relative;min-width:0;display:flex}
.tile.wide{grid-column:span 2}
.ib{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:80px;padding:8px 4px 7px;border-radius:16px;background:linear-gradient(#251d50,#1b1540);border:2px solid #2f2760;box-shadow:0 4px 0 var(--sh),0 6px 14px rgba(0,0,0,.3);min-width:0;transition:transform .08s}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
@media (hover:hover){.ib:not(:disabled):hover{border-color:color-mix(in srgb,var(--c,#2ff3ff) 70%,transparent);box-shadow:0 4px 0 var(--sh),0 0 16px color-mix(in srgb,var(--c,#2ff3ff) 45%,transparent)}}
.ib .ico{width:42px;height:34px;flex:none}
.ib .lbl{font-weight:600;font-size:15px;line-height:1.1;text-align:center;overflow-wrap:anywhere}
.ib .key{position:absolute;left:7px;top:5px;z-index:1;background:rgba(11,8,26,.75);font-size:11px;font-weight:700;font-family:var(--fmono);color:var(--ink2);border-radius:6px;padding:0 6px}
.ib .qty{position:absolute;right:6px;top:5px;z-index:1;background:var(--pink);box-shadow:var(--gP);color:#fff;border-radius:9px;padding:0 7px;font-weight:700;font-size:13px;font-family:var(--fmono)}
.ib .qty~.weird{display:none}
.ib .weird{position:absolute;right:5px;top:5px;font-size:10px;background:rgba(11,8,26,.75);color:var(--gold);border-radius:6px;padding:0 4px}

<div class="nightveil"></div>
<div class="app" id="app">

</div>

<script>
'use strict';

const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const BASES=[
 {id:'noir',name:'Thé noir',color:'#a8643a'},{id:'jasmin',name:'Thé jasmin',color:'#e9d27e'},{id:'matcha',name:'Matcha avoine',color:'#9cc96b'},
 {id:'lait',name:'Lait',color:'#fbf3e4'},{id:'choco',name:'Chocolat',color:'#7a4a32'},{id:'taro',name:'Taro',color:'#b99de8'}];

 {id:'fraise',name:'Fraise',sir:'sirop fraise',color:'#ff3d8f'},{id:'peche',name:'Pêche',sir:'sirop pêche',color:'#ffa05e'},
 {id:'myrtille',name:'Myrtille',sir:'sirop myrtille',color:'#6a6bff'},{id:'caramel',name:'Caramel',sir:'sirop caramel',color:'#c8862a'},
 {id:'cornichon',name:'Cornichon',sir:'sirop cornichon',color:'#7aa32c',weird:true},{id:'ail',name:'Ail',sir:'sirop d’ail',color:'#e8dcb4',weird:true}];

 {id:'tapioca',name:'Tapioca',label:'Perles tapioca',alt:'tapioca',the:'les perles tapioca',color:'#3b2420'},
 {id:'litchi',name:'Litchi',label:'Perles litchi',alt:'perles litchi',the:'les perles litchi',color:'#fde9f0'},
 {id:'wasabi',name:'Wasabi',label:'Perles wasabi',alt:'perles wasabi',the:'les perles wasabi',color:'#77cc35',weird:true},
 {id:'bleues',name:'Bleues',label:'Perles bleues',alt:'perles bleues',the:'les perles bleues',color:'#3ab4ff'},
 {id:'coco',name:'Coco',label:'Éclats de coco',alt:'éclats de coco',the:'les éclats de coco',color:'#fff6d6',crunchy:true},

const R=(id,name,base,syrup,tops,seal,diff,ask,x={})=>({id,name,base:[].concat(base),syrup:syrup===null?[null]:[].concat(syrup),tops,seal:[].concat(seal),diff,ask,...x});
const RECIPES=[
 R('laitfraise','Lait fraise','lait','fraise',[T('tapioca')],'rose',1,'Un lait fraise avec des perles de tapioca, s’il te plaît ! Et le couvercle rose, c’est mon préféré.'),
 R('classique','Classique caramel','noir','caramel',[T('tapioca')],'rose',1,'Un thé noir au caramel avec du tapioca. Couvercle rose, comme d’habitude.'),
 R('jasminnature','Jasmin nature','jasmin',null,[T('litchi')],'dore',1,'Un thé jasmin, surtout sans sirop, avec des perles litchi. Et le couvercle étoilé !'),
 R('matchavoine','Matcha double perles','matcha',null,[T('tapioca',2)],'vert',2,'Matcha avoine, pas de sirop, et DOUBLE dose de tapioca. Couvercle vert, merci !'),
 R('tarocroquant','Taro croquant','taro',null,[ANY(['coco','crumble'],1,'croquant')],'violet',2,'Un taro avec un topping croquant, peu importe lequel. Couvercle violet, évidemment.'),
 R('noirlitchi','Caramel litchi','noir','caramel',[T('litchi')],'rose',2,'Thé noir caramel… mais avec des perles litchi cette fois. Couvercle rose.'),
 R('laitmyrtille','Lait myrtille','lait','myrtille',[T('bleues',2)],'violet',2,'Un lait myrtille avec plein de perles bleues. Double dose ! Couvercle violet.'),
 R('laitmangue','Lait mangue','lait',['peche','fraise'],[T('mangue',2)],'dore',3,'Un lait avec double perles mangue et le sirop fruité que tu veux, pêche ou fraise. Couvercle étoilé.'),
 R('jasminpeche','Jardin de jasmin','jasmin','peche',[T('litchi'),T('coco')],'dore',3,'Jasmin pêche, perles litchi et éclats de coco. Le couvercle étoilé, s’il te plaît.'),
 R('chococrumble','Choco crumble','choco','caramel',[T('tapioca'),T('crumble')],'violet',3,'Chocolat caramel avec tapioca ET crumble. Couvercle violet. Je mérite ça.'),
 R('matchasoleil','Matcha soleil','matcha','fraise',[T('mangue')],'vert',2,'Un matcha à la fraise avec des perles mangue. Couvercle vert.'),
 R('noirpeche','Thé noir pêche','noir','peche',[T('tapioca'),T('litchi')],'rose',3,'Thé noir pêche, une dose de tapioca et une de litchi. Couvercle rose !'),

 R('noirail','Thé noir à l’ail','noir','ail',[T('tapioca')],'violet',2,'Thé noir, sirop d’ail, une dose de tapioca. C’est pour ma santé. Couvercle violet.',{weird:true,love:'Ça éloigne les vampires ET la morosité. Merci !'}),

 {id:'bete',name:'La Bête des Profondeurs',desc:'Labo : taro + perles litchi + perles bleues. Une méduse lumineuse suit ton doigt.',hint:'Quelque chose vit au fond d’un taro… là où le litchi croise le bleu.'},
 {id:'fraise_mord',name:'La Fraise qui mord',desc:'Sirop fraise + perles wasabi : le gobelet ouvre les yeux et croque la paille.',hint:'Le rose n’aime pas qu’on le pique.'},

  if(G.busy)return;

  if(G.picked){const pb=document.querySelector(`#btns [data-act="${a}"]`);if(pb){pb.classList.remove('picked');void pb.offsetWidth;pb.classList.add('picked')}}
  if(k==='base'){if(G.mixMode){G.mixSel=G.mixSel.includes(v)?G.mixSel.filter(x=>x!==v):[...G.mixSel,v].slice(-2);SFX.click();renderBand()}else pourBase([v])}

function evalParts(r,d){
  const out={};
  {const ok=!d.base2&&r.base.includes(d.base),diffs=[];
    if(!ok){if(d.base2)diffs.push(`Mélange ${I(d.base).name.toLowerCase()}-${lc(I(d.base2).name)} au lieu ${de(orList(r.base))}`);else if(!d.base)diffs.push('Il manque la base '+orList(r.base));else diffs.push(`${I(d.base).name} au lieu ${de(orList(r.base))}`)}
    out.base={ok,diffs,oks:ok?['Base '+lc(I(d.base).name)]:[],pts:ok?35:0}}
  {const ok=r.syrup.includes(d.syrup)&&!(d.dose>1),diffs=[];
    if(!ok){if(d.syrup&&d.dose>1&&r.syrup.includes(d.syrup))diffs.push(`Double dose de ${I(d.syrup).sir} au lieu d’une`);
      else if(!d.syrup)diffs.push(`Il manque le ${r.syrup.map(id=>I(id).sir).join(' ou le ')}`);
      else if(r.syrup[0]===null)diffs.push(`${cap(I(d.syrup).sir)} en trop (sans sirop demandé)`);
      else diffs.push(`${cap(I(d.syrup).sir)} au lieu du ${r.syrup.map(id=>I(id).sir).join(' ou du ')}`)}
    out.syrup={ok,diffs,oks:ok?[d.syrup?cap(I(d.syrup).sir):'Sans sirop, comme demandé']:[],pts:ok?25:0}}
  {const have=uniq(d.layers),used=new Set(),diffs=[],oks=[],miss=[];let good=0;
    for(const q of r.tops){const cands=q.o.filter(id=>have.includes(id)&&!used.has(id));
      const id=cands.find(x=>cnt(d,x)===q.n)||cands[0];
      if(!id){miss.push(q);continue}used.add(id);const c=cnt(d,id);
      if(c===q.n){good++;oks.push(`${I(id).label} ×${c}`)}else{good+=.5;diffs.push(`${c} dose${c>1?'s':''} ${de(I(id).alt)} au lieu de ${q.n}`)}}
    const extra=have.filter(id=>!used.has(id));
    const m2=miss.slice(),e2=extra.slice();
    while(m2.length&&e2.length&&m2[0].o.length===1){const m=m2.shift(),e=e2.shift();diffs.push(`${I(e).label} au lieu ${de(I(m.o[0]).alt)}`)}
    m2.forEach(q=>diffs.push(q.o.length>1?`Il manque un topping ${q.what||''} (${orList(q.o)})`.replace('  ',' '):`Il manque ${I(q.o[0]).the}${q.n>1?` (×${q.n})`:''}`));
    e2.forEach(id=>diffs.push(`${I(id).label} en trop`));
    const den=Math.max(r.tops.length,have.length);
    if(!den)oks.push('Sans topping, comme demandé');
    out.tops={ok:!diffs.length,diffs,oks,pts:den?Math.round(30*good/den):30}}
  {const ok=r.seal.includes(d.seal),diffs=[];
    if(!ok){if(!d.seal)diffs.push('Il manque l’opercule '+r.seal.map(id=>lc(I(id).name)).join(' ou '));else diffs.push(`Opercule ${lc(I(d.seal).name)} au lieu ${de(r.seal.map(id=>lc(I(id).name)).join(' ou '))}`)}
    out.seal={ok,diffs,oks:ok?['Opercule '+lc(I(d.seal).name)]:[],pts:ok?10:0}}
  return out;
}
function evaluate(r,d){
  const P=evalParts(r,d),parts=[P.base,P.syrup,P.tops,P.seal];
  const diffs=parts.flatMap(p=>p.diffs),oks=parts.flatMap(p=>p.oks),score=parts.reduce((a,p)=>a+p.pts,0);
  let weird=null;
  if(d.syrup&&I(d.syrup).weird&&!r.syrup.includes(d.syrup))weird='Du '+I(d.syrup).sir;
  if(!weird){const w=uniq(d.layers).find(id=>I(id).weird&&!r.tops.some(q=>q.o.includes(id)));if(w)weird='Des '+lc(I(w).label)}
  return{score,perfect:!diffs.length,diffs,oks,weird};
}
function drinkFx(d){

}

function orderResult(timeout,elapsed){
  const o=cur(),r=o.recipe,d=JSON.parse(JSON.stringify(G.drink));
  const ev=evaluate(r,d),perfect=ev.perfect&&!timeout,pts=timeout?0:ev.score;
  const bonus=G.mode==='rush'&&pts>0?Math.round(25*Math.max(0,G.timeLeft)/G.timeTotal):0;
  G.score+=pts+bonus;G.results.push({name:r.name,d,score:pts+bonus,perfect});
  G.perfectStreak=perfect?G.perfectStreak+1:0;
  let client=o.client,mood,line,fx=timeout?[]:drinkFx(d),note='';
  if(r.riddle){if(perfect){client=MOON;mood='happy';line='Tu as lu mon ticket… Je suis Mme Lune. Je ne descends qu’une nuit par mois.';unlock('ticket_impossible')}else{mood='sad';line='Ce n’est pas la recette de mon énigme… La silhouette s’efface dans la vapeur.'}}
  else if(timeout){mood='angry';line=pick(TIMEOUT)}

  else if(ev.score===0){mood='shock';line='C’est… une œuvre d’art ? Je vais l’encadrer.';unlock('oeuvre')}
  else if(ev.score>=70){mood='normal';line=pick(ALMOST)}else{mood='sad';line=pick(BAD)}
  if(fx.includes('licorne')&&!perfect){mood='shock';line='Mon verre… brille en arc-en-ciel ?! Ce n’est pas ma commande, mais je le garde.'}
  if(G.mode==='rush'&&perfect&&elapsed<8){fx.push('eclair');line='Déjà ?! Tu es une fusée. '+line;unlock('eclair')}
  if(perfect&&d.layers.includes('tapioca'))fx.push('ghost');

  if(mood==='happy')SFX.win();else if(mood==='sick')SFX.cough();else if(mood==='normal')SFX.meh();else SFX.fail();

  const model=!r.riddle||perfect?cupSVG(modelDrink(r),{straw:true}):cupSVG(newDrink(),{mystery:true});
  const opts={straw:!!d.seal,eyes:fx.includes('fraise_mord'),bite:fx.includes('fraise_mord'),stars:fx.includes('minuit'),ghost:fx.includes('ghost'),rainbow:fx.includes('licorne')};
  let list;
  if(r.riddle&&!perfect)list=`<li class="info">La recette reste un mystère (${ev.diffs.length} différence${ev.diffs.length>1?'s':''}). Relis le poème !</li>`;
  else if(timeout)list='<li>Le client est parti avant d’être servi</li>';
  else list=ev.diffs.map(x=>`<li>${x}</li>`).join('')+ev.oks.map(x=>`<li class="ok">${x}</li>`).join('');
  if(note)list+=`<li class="info">${note}</li>`;
  const last=G.idx>=G.orders.length-1;
  $('#resCard').innerHTML=`<div class="resTop"><div class="resFace mood-${mood}">${faceSVG(client,mood)}</div><div class="resBubble"><b>${client.name}</b><br>${line}</div></div>
    <h2 class="resTitle ${title[1]}">${title[0]}</h2>
    <div class="compare"><figure><div class="mini">${model}</div><figcaption>Ticket</figcaption></figure><figure><div class="mini" id="mineCup">${cupSVG(d,opts)}</div><figcaption>Ton verre</figcaption></figure></div>
    <ul class="diffs">${list}</ul><div class="scoreLine">+${pts} pts${bonus?`<span>+${bonus} rapidité</span>`:''}</div>
    <div class="cardBtns"><button class="big" id="resNext" data-enter>${last?'Score final 🏆':'Client suivant ▶'}</button></div>`;
  $('#resModal').classList.add('open');
  let gone=false;$('#resNext').onclick=()=>{if(gone)return;gone=true;SFX.click();closeModals();if(last)showFinal();else{G.idx++;startOrder()}};
  applyFx(fx,d);updateHeader();

function labEval(d){
  const h=id=>d.base===id||d.base2===id||d.syrup===id||d.layers.includes(id),u=uniq(d.layers);
  if(!d.base&&!d.syrup&&!d.layers.length)return{name:'La Commande blanche',score:10,line:'*sluuurp*… Très aérien.',mood:'sip',secrets:['blanche'],fx:['blanche']};
  const sec=[];
  if(isSwamp(d))sec.push('marecage');
  if(d.base==='taro'&&h('litchi')&&h('bleues'))sec.push('bete');
  if(h('choco')&&d.syrup==='cornichon'&&d.dose>1)sec.push('cornichon');
  if(d.base==='noir'&&d.syrup==='myrtille'&&h('tapioca'))sec.push('minuit');
  if(d.base==='jasmin'&&d.syrup==='peche'&&h('litchi')&&d.seal==='dore')sec.push('berceuse');
  if(d.syrup==='fraise'&&h('wasabi'))sec.push('fraise_mord');
  if(d.base==='lait'&&d.syrup==='fraise'&&h('bleues')&&h('mangue'))sec.push('licorne');
  if(u.length>=3)sec.push('debordement');
  if(d.layers.length>=5&&d.seal)sec.push('gonfle');
  const SP={marecage:['Le Matcha de marécage',4,'… Il y a une grenouille qui me fait coucou au fond. Je… je bois quand même. *glou*','shock'],cornichon:['L’Incident Cornichon',1,'…','shock'],bete:['La Bête des Profondeurs',9,'Il y a… quelque chose qui nage là-dedans. Et ça brille !','shock'],berceuse:['La Berceuse du jasmin',10,'Il… il chante ? Je crois que je vais pleurer.','happy'],minuit:['Le Thé de minuit',9,'On dirait que la nuit est tombée dans mon verre.','happy'],licorne:['Le Lait de licorne',9,'Il brille en arc-en-ciel ! Je n’ose pas le boire. Bon, si.','happy'],fraise_mord:['La Fraise qui mord',5,'Aïe ! Elle a croqué ma paille !','shock']};
  let name,score,line,mood,surprise=false,taster=null;
  for(const id of ['marecage','cornichon','bete','berceuse','licorne','minuit','fraise_mord'])if(sec.includes(id)){[name,score,line,mood]=SP[id];break}
  if(sec.includes('marecage'))taster={...MOCHI};
  if(!name)for(const c of SURPRISE)if(c.t(d,h)){({name,score,line}=c);mood='happy';surprise=true;break}
  if(!name){
    const real=RECIPES.find(r=>!r.weird&&!d.base2&&r.base.includes(d.base)&&r.syrup.includes(d.syrup)&&r.tops.length===u.length&&r.tops.every(q=>q.o.some(id=>cnt(d,id)===q.n)));
    let sc=6;const pairs=PAIRS.filter(p=>h(p[0])&&h(p[1]));sc+=Math.min(3,pairs.length*1.5);
    ['wasabi','ail','cornichon'].forEach(w=>{if(h(w))sc-=2.5});
    if(!d.base)sc-=2;if(d.base2)sc-=.5;if(u.length>=3)sc-=1;if(d.layers.length>=5)sc-=.5;if(d.dose>1)sc-=(h('cornichon')||h('ail'))?1.5:.5;if(!d.seal)sc-=.5;
    score=clamp(Math.round(sc),1,10);if(real)score=Math.max(score,8);
    const bn=d.base?(d.base2?`Duo ${lc(I(d.base).name)}-${lc(I(d.base2).name)}`:BASE_N[d.base]):'Eau mystère';
    name=real?real.name+' maison':`${bn}${d.syrup?' '+(d.dose>1?(SYR_A2[d.syrup]||'très '+SYR_A[d.syrup]):SYR_A[d.syrup]):''}${u[0]?' '+TOP_P[u[0]]:''}${u.length>1?' et compagnie':''}`;
    const sl=score>=9?'Chef-d’œuvre. Je reviendrai demain.':score>=7?'Franchement bon !':score>=5?'Intéressant… très intéressant.':score>=3?'Je vais garder ça pour mon pire ennemi.':'*Kof !* Qui t’a appris à faire ça ?!';
    const w=['wasabi','ail','cornichon'].find(h);
    line=w?`${sl} ${WEIRD_LINES[w]}`:pairs.length?`${sl} ${pairs[0][2]}`:sl;
    if(d.layers.length>=5)line+=' Et ça fait beaucoup de perles.';
    mood=score>=7?'happy':score>=5?'normal':score>=3?'sad':'sick';
  }
  return{name,score,line,mood,secrets:sec,fx:sec.slice(),surprise,taster};
}

$('#track').innerHTML=[0,1,2,3,4].map(machineHTML).join('');
$('#menuCups').innerHTML=[{base:'matcha',syrup:null,dose:0,layers:['tapioca','tapioca'],seal:'vert'},{base:'lait',syrup:'fraise',dose:1,layers:['tapioca'],seal:'rose'},{base:'taro',syrup:'myrtille',dose:1,layers:['bleues','coco'],seal:'violet'}].map(d=>cupSVG(d,{straw:true})).join('');
$('#band').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act)});
$('#track').addEventListener('click',e=>{if(e.target.closest('#redbtn'))return redTap(e);const m=e.target.closest('.mbody');if(m)machineTap(+m.parentNode.dataset.i,e.target)});
$('#oldlogo').onclick=logoTap;
$('#hLogo').onclick=goMenu;$('#hMenu').onclick=goMenu;$('#hCarnet').onclick=openCarnet;$('#mCarnet').onclick=openCarnet;
$('#hMute').onclick=toggleMute;$('#mMute').onclick=toggleMute;$('#title').onclick=titleTap;
document.querySelectorAll('.mbtn').forEach(b=>b.onclick=()=>startGame(b.dataset.mode));
document.addEventListener('pointerdown',e=>{G.lastAct=Date.now();if(G.sleeping)wake(!!e.target.closest('#cupwrap'))},true);
window.addEventListener('resize',()=>{if(G.mode){layoutCols();renderFb()}});
document.addEventListener('keydown',e=>{
  G.lastAct=Date.now();if(G.sleeping)wake(false);
  if(e.key==='Escape'){if($('#carnet').classList.contains('open'))closeCarnet();return}
  const open=document.querySelector('.modal.open');
  if(open){if(e.key==='Enter'){const b=open.querySelector('[data-enter]');if(b){e.preventDefault();b.click()}}return}
  if($('#menu').classList.contains('open')){if(e.key==='Enter'&&!e.target.closest('button')){e.preventDefault();startGame('calm')}return}
  if(!G.mode)return;
  if(/^[1-9]$/.test(e.key)){const b=document.querySelector(`#btns [data-key="${e.key}"]`);if(b&&!b.disabled){e.preventDefault();b.click()}}
  else if(e.key==='Enter'){const b=document.querySelector('#btns [data-primary]');if(b&&!b.disabled){e.preventDefault();b.click()}}
  else if((e.key==='-'||e.key==='Backspace')&&G.station===2&&G.drink.layers.length){e.preventDefault();act('minus:'+G.drink.layers[G.drink.layers.length-1])}
});
updateHeader();requestAnimationFrame(loop);
</script>
</body>
</html>
